name: Deploy to Cloudflare

# Auto-deploys the site to Cloudflare on every push to main.
# One-time setup required (see SELF_HOSTING.md → "Auto-deploy with GitHub Actions"):
#   - Repo secret CLOUDFLARE_API_TOKEN   (Workers Scripts: Edit, D1: Edit, Workers R2 Storage: Edit)
#   - Repo secret CLOUDFLARE_ACCOUNT_ID
# Twilio secrets stay on Cloudflare (set once via `wrangler secret put`) and
# persist across deploys — they are NOT needed here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Prevent overlapping deploys from racing each other.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run cf:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
